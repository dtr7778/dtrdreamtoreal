# Render Blueprint - BullMQ worker (prebuilt GHCR image).
#
# The worker is its own app (`apps/worker`), so its image entrypoint already
# runs the worker (`node dist/index.js`). `render.yaml` is applied from the
# Render Dashboard (Blueprints) or the Render CLI.
#
# Before syncing:
#   1. Add a GHCR registry credential in Render (Workspace Settings -> Container
#      Registry Credentials) named `ghcr-dtr`, with a GitHub PAT that has
#      `read:packages`. The package must grant Render read access.
#   2. Fill in the `sync: false` values (they are shared with the API service;
#      values such as BULLMQ_SIGNING_SECRET MUST match the API exactly).
#   3. Keep this service's region aligned with your Redis/Postgres region so
#      private networking works.

services:
  - type: worker
    name: dtr-backend-worker
    runtime: image
    image:
      url: ghcr.io/dtr7778/dtrdreamtoreal/worker:latest
      creds:
        fromRegistryCreds:
          name: ghcr-dtr
    region: singapore
    plan: 1c-2g
    numInstances: 1
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: dtr-backend

envVarGroups:
  # Shared with the API service so both processes see identical secrets.
  - name: dtr-backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: DTR - Dream To Real
      - key: API_LOG_LEVEL
        value: info
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_USERNAME
        value: default

      # --- must match the API service exactly (job signing / auth) ---
      - key: BULLMQ_SIGNING_SECRET
        sync: false
      - key: CSRF_TOKEN
        sync: false

      # --- external services ---
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_INBOUND_WEBHOOK_SECRET
        sync: false
      - key: RESEND_OUTBOUND_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_PSI_API_KEY
        sync: false
      - key: GOOGLE_CRUX_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET_NAME
        sync: false

      # --- urls / mail (shared with the API) ---
      - key: SITE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: GOOGLE_AUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_AUTH_CLIENT_SECRET
        sync: false
      - key: SUPPORT_MAIL
        sync: false
      - key: SYSTEM_MAIL
        sync: false
